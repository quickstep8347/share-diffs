<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Stream Receiver — indices-based (simplified)</title>
<style>
  body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#111;color:#eee}
  header{padding:12px 16px;background:#222;position:sticky;top:0}
  main{padding:16px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .card{background:#1b1b1b;border-radius:12px;padding:12px}
  button{background:#4caf50;border:none;color:#fff;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
  button.secondary{background:#333}
  button[disabled]{opacity:.5;cursor:not-allowed}
  .small{opacity:.85;font-size:.9em}
  video{width:100%;max-width:520px;background:#000;border-radius:12px}
  .video-wrap{position:relative}
  canvas#overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  code{background:#222;padding:2px 6px;border-radius:6px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
</style>

<header><b>QR Stream Receiver</b> — indices-based (explicit index list per frame)</header>
<main>
  <div class="row">
    <!-- Camera -->
    <div class="card" style="flex:1;min-width:320px">
      <div class="video-wrap">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="small" id="camInfo" style="white-space:pre-wrap;margin-top:6px">–</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button id="startBtn">Start</button>
        <button id="stopBtn" class="secondary" disabled>Stop</button>
        <select id="cameraSel"></select>
      </div>
    </div>

    <!-- Status -->
    <div class="card" style="flex:1;min-width:300px">
      <div><b>Status</b></div>
      <div class="kv small" style="margin-top:6px">
        <div>Session:</div>         <div><code id="sid">–</code></div>
        <div>Decoded Frames:</div>  <div><span id="symCount">0</span> / <span id="N">?</span></div>
        <div>Total bytes:</div>     <div><span id="tot">?</span></div>
        <div>Recovered chunks:</div><div><span id="rec">0</span> / <span id="K">?</span></div>
        <div>SHA-256 (calc):</div>  <div><code id="shaCalc">—</code></div>
        <div>SHA-256 (expected):</div><div><code id="shaExp">—</code></div>
      </div>
      <div class="small" style="margin-top:8px">Progress</div>
      <div style="height:12px;background:#333;border-radius:6px;overflow:hidden;margin:4px 0 2px">
        <div id="bar" style="height:100%;width:0;background:#4caf50"></div>
      </div>
      <div style="margin-top:10px">
        <button id="saveBtn" disabled>Save File</button>
      </div>
      <div id="msg" class="small" style="margin-top:10px;white-space:pre-wrap"></div>
    </div>

    <!-- Diagnostics -->
    <div class="card" style="flex:1;min-width:320px">
      <div><b>Diagnostics</b></div>
      <div id="diag" class="small" style="white-space:pre-wrap;margin-top:6px"></div>
      <div id="last" class="small" style="white-space:pre-wrap;margin-top:8px"></div>
      <div id="eqstats" class="small" style="white-space:pre-wrap;margin-top:8px"></div>
      <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap">
        <button id="exportHist" class="secondary">Export history</button>
        <label class="small"><input type="checkbox" id="freezeDiag"> Freeze updates</label>
      </div>
      <div id="histSummary" class="small" style="white-space:pre-wrap; margin-top:8px"></div>
      <div id="histList" class="small" style="white-space:pre-wrap; max-height:240px; overflow:auto; border-top:1px solid #333; margin-top:6px; padding-top:6px"></div>
    </div>
  </div>
</main>

<script>
/***** Helpers *****/
const u32 = n => (n >>> 0);
function b64uToBytes(s){
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const b = atob((s + pad).replace(/-/g,'+').replace(/_/g,'/'));
  const ua = new Uint8Array(b.length);
  for (let i=0;i<b.length;i++) ua[i] = b.charCodeAt(i);
  return ua;
}
async function sha256Hex(buf){
  const digest = await crypto.subtle.digest('SHA-256', buf);
  const a = new Uint8Array(digest);
  return Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('');
}

/***** Diagnostics config *****/
const DEDUP_WINDOW_MS = 220;
const LOG_DUP_EVENTS = false;
const UNIQUE_REASONS_PER_ID = true;
const HISTORY_LIMIT = 2000;

/***** History structures & helpers *****/
const hist = new Map();
const recentById = new Map();
let degHist = {}; // degree == indices.length
let rawDeg1Seen = 0;

function noteOutcome(id, outcome){
  const now = outcome.t;
  if (recentById.has(id) && (now - recentById.get(id) < DEDUP_WINDOW_MS)) return;
  let h = hist.get(id);
  if (!h){
    if (hist.size >= HISTORY_LIMIT){ const oldestKey = hist.keys().next().value; hist.delete(oldestKey); }
    h = { first: outcome, reasons: new Set([outcome.type]), events: [outcome], counts: { [outcome.type]: 1 }, lastTs: now };
    hist.set(id, h);
  } else {
    if (!LOG_DUP_EVENTS && outcome.type === 'dup'){ recentById.set(id, now); return; }
    if (UNIQUE_REASONS_PER_ID && h.reasons.has(outcome.type)){
      h.counts[outcome.type] = (h.counts[outcome.type] || 0) + 1;
      recentById.set(id, now); return;
    }
    h.reasons.add(outcome.type);
    h.events.push(outcome);
    if (h.events.length > 6) h.events.shift();
    h.counts[outcome.type] = (h.counts[outcome.type] || 0) + 1;
    h.lastTs = now;
  }
  recentById.set(id, now);
}

function renderHistory(){
  const freeze = document.getElementById('freezeDiag')?.checked;
  if (freeze) return;
  const totals = { accept:0, dup:0, sid:0, parse:0, idx:0, cs:0, other:0 };
  for (const [,h] of hist){ totals[h.first.type] = (totals[h.first.type] || 0) + 1; }
  const degSummary = Object.keys(degHist).sort((a,b)=>Number(a)-Number(b)).map(k=>`d=${k}:${degHist[k]}`).join('  ');
  document.getElementById('histSummary').textContent =
`Symbols tracked: ${hist.size}
First-event breakdown: ${Object.entries(totals).map(([k,v])=>`${k}=${v}`).join('  ')}
Degree histogram (accepted): ${degSummary}
Raw degree-1 seen: ${rawDeg1Seen}`;
  const recent = Array.from(hist.entries()).slice(-20);
  const lines = [];
  for (const [id, h] of recent){
    const f = h.first;
    const evs = h.events.map(e => `${e.type}${(e.d!=null?`(d=${e.d})`:'')}@${(e.t % 1e7)|0}`).join(', ');
    lines.push(`i=${id}  first=${f.type}${(f.d!=null?`(d=${f.d})`:'')}  counts=${JSON.stringify(h.counts)}  | ${evs}`);
  }
  document.getElementById('histList').textContent = lines.join('\n');
}

/***** Session + Decoder *****/
let sess = {
  sid:null, len:0, K:0, N:0, cs:0,
  seen:new Set(), eqs:[], solved:new Map(), solvedCount:0,
  shaExp:null
};

function resetSession(meta){
  sess.sid = meta.sid;
  sess.len = meta.len | 0;
  sess.K   = meta.K  | 0;
  sess.N   = meta.N  | 0;
  sess.cs  = 0;            // learn from first accepted payload
  sess.shaExp = meta.sha256 || null; // if sender starts embedding it per-frame later
  sess.seen.clear(); sess.eqs.length = 0; sess.solved.clear(); sess.solvedCount = 0;
  degHist = {}; rawDeg1Seen = 0;
  reasons = { sid:0, parse:0, dup:0, idx:0, cs:0, other:0 };
  document.getElementById('shaExp').textContent = sess.shaExp || '—';
  document.getElementById('shaCalc').textContent = '—';
  updateUI(); updateEqStats(); renderHistory();
}

function ingestSymbol(payload, idxs){
  // Defensive copy and sort idxs
  idxs = Array.from(idxs).map(x=>x|0).sort((a,b)=>a-b);
  // Bounds & uniqueness checks
  if (idxs.length===0 || idxs[0] < 0 || idxs[idxs.length-1] >= sess.K){ reasons.idx++; return; }
  for (let z=1; z<idxs.length; z++){ if (idxs[z]===idxs[z-1]){ reasons.idx++; return; } }

  // Learn chunk size on first accept
  if (!sess.cs){ sess.cs = payload.length|0; }
  if (payload.length !== sess.cs){ reasons.cs++; return; }

  if (idxs.length === 1) rawDeg1Seen++;
  degHist[idxs.length] = (degHist[idxs.length] || 0) + 1;

  const data = payload.slice();
  // Reduce with solved
  for (const k of Array.from(sess.solved.keys()).sort((a,b)=>a-b)){
    const pos = idxs.indexOf(k);
    if (pos >= 0){
      const ck = sess.solved.get(k);
      for (let i=0;i<data.length;i++) data[i] ^= ck[i];
      idxs.splice(pos, 1);
    }
  }
  if (idxs.length === 0) return; // became redundant
  sess.eqs.push({idxs:new Set(idxs), data});
  peel();
}

function peel(){
  let progress = true;
  while(progress){
    progress = false;
    for (const e of sess.eqs){
      if (e.idxs.size === 1){
        const k = e.idxs.values().next().value;
        if (!sess.solved.has(k)){
          sess.solved.set(k, e.data);
          sess.solvedCount++;
          for (const f of sess.eqs){
            if (f===e) continue;
            if (f.idxs.has(k)){
              const ck = e.data, fd = f.data;
              for (let i=0;i<fd.length;i++) fd[i] ^= ck[i];
              f.idxs.delete(k);
            }
          }
          progress = true;
        }
      }
    }
    sess.eqs = sess.eqs.filter(e=>e.idxs.size>0);
  }
  updateUI(); updateEqStats();
  if (sess.solvedCount >= sess.K && sess.cs > 0) assembleAndEnableSave();
}

async function assembleAndEnableSave(){
  // Assemble into K*cs, then trim to len
  const full = new Uint8Array(sess.K * sess.cs);
  for (let k=0; k<sess.K; k++){
    const c = sess.solved.get(k) || new Uint8Array(sess.cs); // zero-fill if somehow missing
    full.set(c, k * sess.cs);
  }
  const finalBytes = full.slice(0, sess.len);

  // Compute SHA-256 (calc) and show + compare if expected known
  try{
    const calc = await sha256Hex(finalBytes);
    document.getElementById('shaCalc').textContent = calc;
  }catch(_){ /* ignore */ }

  const url = URL.createObjectURL(new Blob([finalBytes], {type:"application/octet-stream"}));
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.onclick = () => { const a = document.createElement('a'); a.href = url; a.download = `qrstream_${sess.sid}.bin`; a.click(); };
  saveBtn.disabled = false;
  msg(`✅ Reconstructed ${finalBytes.length} bytes. Save is enabled.`);
}

/***** UI helpers *****/
function msg(s){ document.getElementById('msg').textContent = s; }
function updateUI(){
  document.getElementById('sid').textContent = sess.sid || '–';
  document.getElementById('K').textContent = sess.K || '?';
  document.getElementById('N').textContent = sess.N || '?';
  document.getElementById('tot').textContent = sess.len || '?';
  document.getElementById('rec').textContent = sess.solvedCount || 0;
  document.getElementById('symCount').textContent = sess.seen.size;
  const pct = sess.K ? Math.min(100, Math.floor((sess.solvedCount / sess.K) * 100)) : 0;
  document.getElementById('bar').style.width = pct + '%';
}
function updateEqStats(){
  let m = Infinity, d1 = 0, d2 = 0, d3 = 0;
  for (const e of sess.eqs){
    const s = e.idxs.size; m = Math.min(m, s);
    if (s === 1) d1++; else if (s === 2) d2++; else if (s === 3) d3++;
  }
  const minDeg = (m === Infinity ? 0 : m);
  document.getElementById('eqstats').textContent =
`Equations: ${sess.eqs.length}, min degree in system: ${minDeg} (d1=${d1}, d2=${d2}, d3=${d3})
Total deg=1 seen (raw): ${rawDeg1Seen}`;
}

/***** Camera and detection *****/
const vEl = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d', {willReadFrequently:true});
const cameraSel = document.getElementById('cameraSel');

let running = false, detector = null, stream = null, rafId = null, deviceId = null;
let detPerSec = 0, accPerSec = 0, lastLen = 0, hadPrefix = false, lastErr = "";
let reasons = { sid:0, parse:0, dup:0, idx:0, cs:0, other:0 };

function sizeOverlayToVideo(){
  const r = vEl.getBoundingClientRect();
  overlay.width = r.width; overlay.height = r.height;
}
function drawDetectionBoxes(codes){
  sizeOverlayToVideo();
  octx.clearRect(0, 0, overlay.width, overlay.height);
  octx.lineWidth = 2; octx.strokeStyle = '#00e676';
  const rw = vEl.videoWidth || 1, rh = vEl.videoHeight || 1;
  for (const c of codes){
    const pts = c.cornerPoints || [];
    if (!pts.length) continue;
    octx.beginPath();
    for (let i=0;i<pts.length;i++){
      const x = (pts[i].x / rw) * overlay.width;
      const y = (pts[i].y / rh) * overlay.height;
      if (i===0) octx.moveTo(x,y); else octx.lineTo(x,y);
    }
    octx.closePath(); octx.stroke();
  }
}

async function listCameras(){
  const devs = await navigator.mediaDevices.enumerateDevices();
  cameraSel.innerHTML = "";
  for (const d of devs){ if (d.kind === 'videoinput'){
    const opt = document.createElement('option');
    opt.value = d.deviceId; opt.textContent = d.label || `Camera ${cameraSel.length+1}`;
    cameraSel.appendChild(opt);
  }}
  if (!deviceId && cameraSel.options.length){
    const envIdx = Array.from(cameraSel.options).findIndex(o => /back|rear|environment/i.test(o.textContent));
    cameraSel.selectedIndex = envIdx >= 0 ? envIdx : 0; deviceId = cameraSel.value;
  }
}

cameraSel.onchange = () => { deviceId = cameraSel.value; if (running){ stop(); start(); } };

setInterval(() => {
  const track = stream ? stream.getVideoTracks()[0] : null;
  const st = track ? track.getSettings() : {};
  document.getElementById('camInfo').textContent =
`Detections/s: ${detPerSec}   Accepted/s: ${accPerSec}
Last raw length: ${lastLen}   QS1 prefix: ${hadPrefix}
Video: ${vEl.videoWidth||0}x${vEl.videoHeight||0}  fps(set): ${st.frameRate||'?'}
Reasons (per s): ${JSON.stringify(reasons)}  Last error: ${lastErr || '—'}`;
  detPerSec = 0; accPerSec = 0;
  reasons = { sid:0, parse:0, dup:0, idx:0, cs:0, other:0 };
}, 1000);

function showBasics(){
  const hasBD = ('BarcodeDetector' in window);
  const hasGUM = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const secure = window.isSecureContext;
  document.getElementById('diag').textContent =
`BarcodeDetector: ${hasBD}
getUserMedia: ${hasGUM}
isSecureContext: ${secure} (protocol=${location.protocol})
origin: ${location.origin || location.href}`;
}
showBasics();

async function start(){
  try{
    if (!('BarcodeDetector' in window)){ msg("❌ No BarcodeDetector. Use Chrome/Edge or desktop."); return; }
    detector = new BarcodeDetector({formats:['qr_code']});
    await listCameras();
    const constraints = {
      video: deviceId ? { deviceId: { exact: deviceId } }
                      : { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    vEl.srcObject = stream; await vEl.play();
    running = true;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    requestAnimationFrame(loop);
  }catch(e){
    msg('getUserMedia/Start error: ' + (e && e.name ? `${e.name}: ${e.message||e}` : e));
  }
}

function stop(){
  running = false; if (rafId) cancelAnimationFrame(rafId);
  if (stream){ for (const t of stream.getTracks()) t.stop(); stream = null; }
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  octx.clearRect(0,0,overlay.width,overlay.height);
}

document.getElementById('startBtn').onclick = start;
document.getElementById('stopBtn').onclick  = stop;

function updateLastFrameDiag(frame, accepted, why){
  const dShow = frame && frame.indices && frame.indices.length;
  document.getElementById('last').textContent =
`Last frame:
  sid match: ${frame ? (frame.sid === sess.sid) : '–'}
  K   match: ${frame ? (frame.K === sess.K) : '–'}
  N   match: ${frame ? (frame.N === sess.N) : '–'}
  degree (|indices|): ${dShow ?? '–'}
  symId: ${frame ? frame.i : '–'}   accepted: ${accepted}   reason: ${why || '-'}`;
}

async function loop(){
  if (!running) return;
  let codes = [];
  try{ codes = await detector.detect(vEl); }
  catch(e){ lastErr = e.message || String(e); }

  if (codes && codes.length){
    detPerSec += codes.length; drawDetectionBoxes(codes);
    for (const code of codes){
      const raw = code.rawValue || '';
      lastLen = raw.length; hadPrefix = raw.startsWith('QS1|');
      if (!hadPrefix) continue;

      let frame=null;
      try{ frame = JSON.parse(raw.slice(4)); }
      catch(e){ reasons.parse++; noteOutcome(-1, { t: performance.now(), type:'parse' }); updateLastFrameDiag(null,false,'parse'); renderHistory(); continue; }

      if (!sess.sid || sess.sid !== frame.sid) resetSession(frame);

      const now = performance.now();

      if (sess.seen.has(frame.i)){
        reasons.dup++; noteOutcome(frame.i, { t: now, type:'dup'});
        updateLastFrameDiag(frame,false,'dup'); renderHistory();
        continue;
      }

      // Accept symbol
      if (!frame.indices || !Array.isArray(frame.indices)){ reasons.idx++; updateLastFrameDiag(frame,false,'idx'); continue; }
      const payload = b64uToBytes(frame.p);
      sess.seen.add(frame.i); accPerSec++;
      noteOutcome(frame.i, { t: now, type:'accept', d: frame.indices.length, payloadLen: payload.length });
      ingestSymbol(payload, frame.indices);
      updateUI(); updateLastFrameDiag(frame,true,'ok'); renderHistory();
    }
  } else {
    octx.clearRect(0,0,overlay.width,overlay.height);
  }
  rafId = requestAnimationFrame(loop);
}

/***** Export history *****/
document.getElementById('exportHist').onclick = function(){
  const obj = Object.fromEntries(hist.entries());
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `qr_hist_${Date.now()}.json`; a.click();
};
</script>
</html>
